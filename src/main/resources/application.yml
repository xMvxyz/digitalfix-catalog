server:
  port: 8081 # Puerto para el catálogo

spring:
  datasource:
    url: jdbc:h2:mem:catalogdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true